name: Build Dev IPA

on:
  push:
    branches: [working]
  workflow_dispatch:

concurrency:
  group: build-dev-ipa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install llvm ninja libarchive
          pip3 install --break-system-packages meson

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -arch arm64 -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/iSH-AOK.app"
          test -d "$APP_PATH"
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="iSH-AOK-dev-${SHORT_SHA}.ipa"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "$IPA_NAME" Payload
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_NAME="${{ steps.package.outputs.ipa_name }}"
          SHORT_SHA="${{ steps.package.outputs.short_sha }}"
          BODY="Unsigned development build from commit ${SHORT_SHA} (auto-published from \`working\`). Re-sign with AltStore, SideStore, or Sideloadly before installing. This release is overwritten on every push."
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi
          gh release create dev-latest "$IPA_NAME" \
            --title "Development Build (${SHORT_SHA})" \
            --notes "$BODY" \
            --prerelease \
            --target "${{ github.sha }}"
