# Manually-dispatched diagnostics for e2e failures that only reproduce on
# x86_64 Linux hosts (the guest-gcc ICE in the qemu test, python2 segfault).
# Runs the suite, then re-runs the interesting failures with extra capture,
# and uploads everything as an artifact for offline analysis.
name: e2e debug

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja
      - name: Build
        run: |
          meson setup build -Dengine=jit
          ninja -C build
      - name: Run e2e suite
        continue-on-error: true
        run: bash tests/e2e/e2e.bash -y
      - name: Diagnostics
        continue-on-error: true
        run: |
          ISH="./build/ish -f e2e_out/testfs"
          mkdir -p debug_out
          # Probe 1: the CPU-conformance binary compiled on the (correct)
          # arm64 backend, run directly under the x86_64 backend. Any diff
          # against expected.txt names the exact instruction+operands the
          # x86_64 gadgets get wrong -- no compiler in the loop.
          $ISH /bin/sh -c "cat > /tmp/qemu-test-prebuilt; chmod +x /tmp/qemu-test-prebuilt" < tests/debug/qemu-test-i386-prebuilt
          $ISH /tmp/qemu-test-prebuilt > debug_out/prebuilt-x86_64.txt 2>&1 || echo "prebuilt rc=$?" >> debug_out/prebuilt-x86_64.txt
          diff tests/e2e/qemu/expected.txt debug_out/prebuilt-x86_64.txt > debug_out/prebuilt.diff && echo "PREBUILT MATCHES" || echo "PREBUILT DIFFERS ($(wc -l < debug_out/prebuilt.diff) diff lines)"
          # Probe 2: the same binary under ptraceomatic (lockstep vs the real
          # CPU); prints the first diverging instruction. printk -> fd 555.
          timeout 900 bash -c "exec 555>debug_out/ptom-prebuilt.printk; ./build/tools/ptraceomatic -f e2e_out/testfs /tmp/qemu-test-prebuilt" > debug_out/ptom-prebuilt.log 2>&1 || echo "ptom-prebuilt rc=$?" >> debug_out/ptom-prebuilt.log
          # Probe 3: the failing cc1 invocation under ptraceomatic. Slow
          # (single-steps everything), so bounded; a divergence usually shows
          # up long before the timeout.
          $ISH /bin/sh -c "source /etc/profile; cd /tmp/e2e/qemu && gcc -E qemu-test.c -msse2 -Wno-attributes -o qemu-test.i" || true
          timeout 2100 bash -c "exec 555>debug_out/ptom-cc1.printk; ./build/tools/ptraceomatic -f e2e_out/testfs /usr/libexec/gcc/i586-alpine-linux-musl/9.3.0/cc1 -fpreprocessed /tmp/e2e/qemu/qemu-test.i -quiet -msse2 -mtune=generic -march=i586 -o /tmp/e2e/qemu/ptom.s" > debug_out/ptom-cc1.log 2>&1 || echo "ptom-cc1 rc=$?" >> debug_out/ptom-cc1.log
          # printk capture is unbounded; keep heads and tails.
          for f in debug_out/*.printk; do
            head -c 2000000 "$f" > "$f.head" || true
            tail -c 2000000 "$f" > "$f.tail" || true
            rm -f "$f"
          done
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            debug_out/
            e2e_out/summary.txt
            e2e_out/*/actual.txt
            e2e_out/*/diff.txt
          if-no-files-found: warn
