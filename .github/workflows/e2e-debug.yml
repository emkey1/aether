# Manually-dispatched diagnostics for e2e failures that only reproduce on
# x86_64 Linux hosts (the guest-gcc ICE in the qemu test, python2 segfault).
# Runs the suite, then re-runs the interesting failures with extra capture,
# and uploads everything as an artifact for offline analysis.
name: e2e debug

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja
      - name: Build
        run: |
          meson setup build -Dengine=jit
          ninja -C build
      - name: Run e2e suite
        continue-on-error: true
        run: bash tests/e2e/e2e.bash -y
      - name: Diagnostics
        continue-on-error: true
        run: |
          ISH="./build/ish -f e2e_out/testfs"
          COMPILE="source /etc/profile; cd /tmp/e2e/qemu && gcc qemu-test.c -o qemu-test -msse2 -no-pie -Wno-attributes -Wno-format"
          mkdir -p debug_out
          # How flaky is the cc1 crash under the plain JIT? printk goes to
          # fd 555; capture it per attempt (JIT fault messages land there).
          for i in 1 2 3 4; do
            bash -c "exec 555>debug_out/compile-$i.printk; $ISH /bin/sh -c \"$COMPILE\"" > debug_out/compile-$i.log 2>&1 \
              && echo "attempt $i: OK" >> debug_out/attempts.txt \
              || { echo "attempt $i: rc=$? $(grep -m1 -E 'internal compiler|Segmentation' debug_out/compile-$i.log)" >> debug_out/attempts.txt; }
          done
          # Bisect: same compile with the JIT block cache/chaining disabled
          # for cc1 (via /proc/ish/i386_no_cache_comm). If the crash vanishes,
          # it lives in block caching/chaining; if it stays, it's gadget
          # semantics or memory management.
          for i in 1 2; do
            bash -c "exec 555>debug_out/nocache-$i.printk; $ISH /bin/sh -c \"echo cc1 > /proc/ish/i386_no_cache_comm; $COMPILE\"" > debug_out/nocache-$i.log 2>&1 \
              && echo "nocache $i: OK" >> debug_out/attempts.txt \
              || echo "nocache $i: rc=$? $(grep -m1 -E 'internal compiler|Segmentation' debug_out/nocache-$i.log)" >> debug_out/attempts.txt
          done
          # And fully single-stepped (one instruction per block). Slow; bound it.
          timeout 1500 bash -c "exec 555>debug_out/sstep.printk; $ISH /bin/sh -c \"echo cc1 > /proc/ish/i386_single_step_comm; $COMPILE\"" > debug_out/sstep.log 2>&1 \
            && echo "single-step: OK" >> debug_out/attempts.txt \
            || echo "single-step: rc=$? $(grep -m1 -E 'internal compiler|Segmentation' debug_out/sstep.log)" >> debug_out/attempts.txt
          # python2 crash: reproduce in the same shape the hello test uses.
          for i in 1 2 3 4 5; do
            bash -c "exec 555>debug_out/py2-$i.printk; $ISH /usr/bin/env sh -c 'source /etc/profile && cd /tmp/e2e/hello && python test_python2.py'" >> debug_out/python2.log 2>&1 \
              || echo "py2 attempt $i failed rc=$?" >> debug_out/python2.log
          done
          # Keep only interesting printk lines (JIT faults, warnings); the
          # trace volume is otherwise unbounded.
          for f in debug_out/*.printk; do
            grep -aE "JIT|ERROR|WARN|FIXME|segfault|bad access" "$f" | head -200 > "$f.grep" || true
            rm -f "$f"
          done
          # Pull the guest-side build tree (temps from the failed attempts).
          $ISH /bin/tar -cf - -C /tmp/e2e qemu | tar -xf - -C debug_out || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            debug_out/
            e2e_out/summary.txt
            e2e_out/*/actual.txt
            e2e_out/*/diff.txt
          if-no-files-found: warn
