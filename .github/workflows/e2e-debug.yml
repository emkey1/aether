# Manually-dispatched diagnostics for e2e failures that only reproduce on
# x86_64 Linux hosts (the guest-gcc ICE in the qemu test, python2 segfault).
# Runs the suite, then re-runs the interesting failures with extra capture,
# and uploads everything as an artifact for offline analysis.
name: e2e debug

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja
      - name: Build
        run: |
          meson setup build -Dengine=jit
          ninja -C build
      - name: Run net_regress (builds testfs, reproduces the small cc1 ICE)
        continue-on-error: true
        run: bash tests/e2e/e2e.bash -y -e '^net_regress$'
      - name: Diagnostics
        continue-on-error: true
        run: |
          ISH="./build/ish -f e2e_out/testfs"
          CC1=/usr/libexec/gcc/i586-alpine-linux-musl/9.3.0/cc1
          mkdir -p debug_out
          # Small deterministic repro: test_unix_peername.c ICEs cc1 at -O2
          # (during RTL pass: cse1). Confirm it still does, from preprocessed
          # source, and keep the .i as the canonical repro.
          $ISH /bin/sh -c "source /etc/profile; cd /tmp/e2e/net_regress && gcc -O2 -E test_unix_peername.c -o peername.i && $CC1 -fpreprocessed peername.i -quiet -O2 -o peername.s" > debug_out/small-repro.log 2>&1 \
            && echo "small repro: cc1 OK (no ICE!)" >> debug_out/small-repro.log \
            || echo "small repro: rc=$?" >> debug_out/small-repro.log
          $ISH /bin/cat /tmp/e2e/net_regress/peername.i > debug_out/peername.i || true
          # ptraceomatic needs the native child to fexecve the guest binary
          # from the fakefs data dir (host modes there are 0644 -> EACCES)
          # and the host kernel must find the ELF's PT_INTERP. Grant both.
          chmod 755 e2e_out/testfs/data$CC1
          sudo cp e2e_out/testfs/data/lib/ld-musl-i386.so.1 /lib/ld-musl-i386.so.1
          sudo chmod 755 /lib/ld-musl-i386.so.1
          # Lockstep the failing compile against the real CPU; the log's tail
          # shows the first divergence. printk -> fd 555.
          timeout 2400 bash -c "exec 555>debug_out/ptom-cc1.printk; ./build/tools/ptraceomatic -f e2e_out/testfs $CC1 -fpreprocessed /tmp/e2e/net_regress/peername.i -quiet -O2 -o /tmp/ptom.s" > debug_out/ptom-cc1.log 2>&1 || echo "ptom-cc1 rc=$?" >> debug_out/ptom-cc1.log
          tail -100 debug_out/ptom-cc1.log || true
          # printk capture is unbounded; keep heads and tails.
          for f in debug_out/*.printk; do
            head -c 2000000 "$f" > "$f.head" || true
            tail -c 2000000 "$f" > "$f.tail" || true
            rm -f "$f"
          done
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            debug_out/
            e2e_out/summary.txt
            e2e_out/*/actual.txt
            e2e_out/*/diff.txt
          if-no-files-found: warn
