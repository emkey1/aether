# One-question experiment: does ISH_DISABLE_HOST_PAGE_MIRROR=1 make the
# x86_64-only guest cc1 ICE disappear? Host-page mirroring is enabled on
# Linux and disabled on macOS -- exactly the observed failure boundary.
name: e2e mirror bisect

on: workflow_dispatch

jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja
      - name: Build
        run: |
          meson setup build -Dengine=jit
          ninja -C build ish tools/fakefsify
      - name: Build testfs
        run: bash tests/e2e/e2e.bash -y -e '^net_regress$' || true
      - name: Bisect
        run: |
          ISH="./build/ish -f e2e_out/testfs"
          COMPILE="source /etc/profile; cd /tmp/e2e/net_regress && gcc -Wall -Wextra -O2 test_unix_peername.c -o t && echo COMPILE-OK"
          mkdir -p debug_out
          run() { echo "=== $1:" | tee -a debug_out/bisect.log; shift; env "$@" $ISH /bin/sh -c "$COMPILE" >> debug_out/bisect.log 2>&1 || echo "rc=$?" >> debug_out/bisect.log; }
          # 2x2: mirroring has two effects -- host mprotect mirroring and the
          # JIT write-revalidate slow path. Which one breaks cc1?
          run "control (mirroring on, expect ICE)"
          run "mirroring on, mprotect skipped" ISH_MIRROR_NO_MPROTECT=1
          run "mirroring off, write-revalidate forced" ISH_DISABLE_HOST_PAGE_MIRROR=1 ISH_FORCE_WRITE_REVALIDATE=1
          run "mirroring off (expect OK)" ISH_DISABLE_HOST_PAGE_MIRROR=1
          tail -60 debug_out/bisect.log
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-bisect
          path: |
            debug_out/
            e2e_out/summary.txt
          if-no-files-found: warn
